services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    ports: ["127.0.0.1:27017:27017"]
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mongodb://mongo:27017/iro
      NODE_ENV: production
    depends_on: [mongo]
    ports: ["5000:5000"]
volumes:
  mongo-data:
